<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Creator Verification Demo</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #101828;
        background: #f5f7fb;
      }

      body {
        margin: 0;
      }

      main {
        width: min(1040px, calc(100% - 32px));
        margin: 40px auto;
      }

      .shell {
        display: grid;
        grid-template-columns: minmax(280px, 380px) 1fr;
        gap: 20px;
        align-items: start;
      }

      .panel {
        background: #ffffff;
        border: 1px solid #d9e2ef;
        border-radius: 8px;
        box-shadow: 0 20px 60px rgba(16, 24, 40, 0.08);
        padding: 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 40px;
        letter-spacing: 0;
      }

      p {
        color: #667085;
        line-height: 1.5;
      }

      label {
        display: block;
        margin: 18px 0 8px;
        font-size: 13px;
        font-weight: 800;
        color: #475467;
        text-transform: uppercase;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #cdd7e5;
        border-radius: 8px;
        padding: 13px 14px;
        font-size: 15px;
      }

      button {
        width: 100%;
        margin-top: 18px;
        border: 0;
        border-radius: 8px;
        padding: 14px;
        background: #155eef;
        color: #ffffff;
        font-size: 16px;
        font-weight: 800;
        cursor: pointer;
      }

      button:disabled {
        background: #98a2b3;
        cursor: not-allowed;
      }

      .decision {
        min-height: 280px;
      }

      .badge {
        display: inline-flex;
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }

      .approve {
        color: #027a48;
        background: #ecfdf3;
      }

      .review {
        color: #b54708;
        background: #fffaeb;
      }

      .block {
        color: #b42318;
        background: #fef3f2;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-top: 18px;
      }

      .metric {
        border: 1px solid #e4e7ec;
        border-radius: 8px;
        padding: 14px;
      }

      .metric span {
        display: block;
        color: #667085;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }

      .metric strong {
        display: block;
        margin-top: 6px;
        font-size: 20px;
      }

      .error {
        border-left: 4px solid #f04438;
        margin-top: 16px;
        padding: 12px;
        color: #b42318;
        background: #fef3f2;
      }

      @media (max-width: 820px) {
        .shell {
          grid-template-columns: 1fr;
        }

        .metrics {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Creator Verification Demo</h1>
      <p>
        Example integration: approve creators when their wallet reaches a
        minimum trust tier.
      </p>

      <section class="shell">
        <form class="panel" id="verification-form">
          <label for="api-base-url">API base URL</label>
          <input
            id="api-base-url"
            value="https://innovation-ai-project-production.up.railway.app"
          />

          <label for="api-key">X-API-Key</label>
          <input id="api-key" type="password" placeholder="YOUR_TRUST_API_KEY" />

          <label for="wallet-address">Creator wallet</label>
          <input
            id="wallet-address"
            value="0x742d35Cc6634C0532925a3b844Bc454e4438f44e"
          />

          <button id="submit-button" type="submit">Verify Creator</button>
        </form>

        <section class="panel decision" id="result-panel">
          <span class="badge review">Waiting</span>
          <h2>Choose a wallet to verify</h2>
          <p>
            The app will call TrustAPI, then map the trust tier to a creator
            platform decision.
          </p>
        </section>
      </section>
    </main>

    <script>
      const tierRank = { unscored: 0, bronze: 1, silver: 2, gold: 3 };
      const form = document.querySelector("#verification-form");
      const resultPanel = document.querySelector("#result-panel");
      const button = document.querySelector("#submit-button");

      function decisionFor(wallet) {
        const rank = tierRank[wallet.trust_tier] || 0;
        if (rank >= 2 && wallet.human_likelihood !== "low") {
          return {
            status: "approve",
            title: "Creator approved",
            text: "Wallet meets the platform trust requirement.",
          };
        }
        if (rank >= 1) {
          return {
            status: "review",
            title: "Manual review",
            text: "Wallet has some trust signals but needs human review.",
          };
        }
        return {
          status: "block",
          title: "Creator blocked",
          text: "Wallet does not meet the platform trust requirement.",
        };
      }

      function renderResult(wallet) {
        const decision = decisionFor(wallet);
        resultPanel.innerHTML = `
          <span class="badge ${decision.status}">${decision.status}</span>
          <h2>${decision.title}</h2>
          <p>${decision.text}</p>
          <div class="metrics">
            <div class="metric">
              <span>Human likelihood</span>
              <strong>${wallet.human_likelihood}</strong>
            </div>
            <div class="metric">
              <span>Trust tier</span>
              <strong>${wallet.trust_tier}</strong>
            </div>
            <div class="metric">
              <span>Confidence</span>
              <strong>${Math.round(wallet.confidence_score * 100)}%</strong>
            </div>
          </div>
          <p><strong>Risk flags:</strong> ${
            wallet.risk_flags.length ? wallet.risk_flags.join(", ") : "none"
          }</p>
        `;
      }

      function renderError(message) {
        resultPanel.innerHTML = `
          <span class="badge block">Error</span>
          <h2>Verification failed</h2>
          <div class="error">${message}</div>
        `;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        button.disabled = true;
        button.textContent = "Verifying...";

        try {
          const baseUrl = document
            .querySelector("#api-base-url")
            .value.replace(/\/$/, "");
          const apiKey = document.querySelector("#api-key").value;
          const walletAddress = document.querySelector("#wallet-address").value;
          const response = await fetch(`${baseUrl}/check_wallet`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-API-Key": apiKey,
            },
            body: JSON.stringify({ wallet_address: walletAddress }),
          });
          const body = await response.json();

          if (!response.ok) {
            throw new Error(body.detail || body.error || "Request failed");
          }

          renderResult(body);
        } catch (error) {
          renderError(error.message);
        } finally {
          button.disabled = false;
          button.textContent = "Verify Creator";
        }
      });
    </script>
  </body>
</html>
